name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build from'
        required: true
        default: 'feat/capacitor-android-clean'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_ARK_SERVER: https://arkade.computer
      VITE_LNURL_SERVER: https://arkade.computer
      VITE_LNURL_DOMAIN: arkade.computer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: |
          pnpm build
          echo "DIST: $(find dist -type f | wc -l) archivos"
          du -sh dist

      - name: Debug - estado inicial de android/ y .npmrc
        run: |
          echo "--- .npmrc"; cat .npmrc 2>/dev/null || echo "(no existe)"
          echo "--- android/ trackeado en git?"
          git ls-files android | head -30 || true
          echo "--- contenido de android/"
          ls -la android 2>/dev/null || echo "(android/ no existe)"
          echo "--- webDir en capacitor.config"
          cat capacitor.config.* 2>/dev/null || echo "(sin capacitor.config)"

      - name: Initialize Capacitor
        run: |
          if [ -d "android" ] && [ -f "android/gradlew" ] && [ -f "android/capacitor.settings.gradle" ] && [ -d "android/capacitor-cordova-android-plugins" ]; then
            echo "android/ with complete config exists, skipping cap add android"
          elif [ -d "android" ]; then
            echo "android/ exists without complete config, removing"
            rm -rf android
            pnpm exec cap add android
          else
            pnpm exec cap add android
          fi

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Copy fresh dist directly to Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Copied $(find android/app/src/main/assets/public -type f | wc -l) files"
          du -sh android/app/src/main/assets/public | tail -1

      - name: Prepare ServiceWorker for Capacitor
        run: node scripts/prepare-service-worker.mjs

      - name: Prepare Android manifest (camera + ML Kit)
        run: node scripts/prepare-android.mjs

      - name: Verify camera permissions in manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          elif [ -f android/app/gradlew ]; then
            chmod +x android/app/gradlew
          else
            find android -name gradlew -type f -exec chmod +x {} \;
          fi

      - name: Debug - estructura del proyecto Gradle
        run: |
          cd android
          echo "--- capacitor.settings.gradle"
          cat capacitor.settings.gradle || true
          echo "--- comprobando rutas de cada subproyecto"
          grep -o "File('[^']*')" capacitor.settings.gradle | sed "s/File('//;s/')//" | while read p; do
            if [ -f "$p/build.gradle" ]; then echo "OK      $p"; else echo "MISSING $p"; fi
          done || true
          echo "--- capacitor-cordova-android-plugins"
          ls -la capacitor-cordova-android-plugins || true
          echo "--- node_modules (@capacitor, @aparajita)"
          ls -la ../node_modules/@capacitor ../node_modules/@aparajita 2>&1 | head -40 || true
          echo "--- versiones"
          cat gradle/wrapper/gradle-wrapper.properties || true

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android -name "app-debug.apk" -o -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH" || true

      - name: Debug - comparar dist con contenido del APK
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          (cd dist && find . -type f | sort) > /tmp/dist.txt
          unzip -Z1 "$APK" | grep '^assets/public/' | sed 's|^assets/public/|./|' | sort > /tmp/apk.txt
          echo "En dist: $(wc -l < /tmp/dist.txt) | En APK: $(wc -l < /tmp/apk.txt)"
          echo "--- Archivos de dist que NO estan en el APK:"
          comm -23 /tmp/dist.txt /tmp/apk.txt || true

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: arkade-wallet-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
