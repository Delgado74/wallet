name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/capacitor-apk
      - feat/capacitor-v8-secure

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: |
          set +e
          pnpm git-info
          pnpm exec tsc --noEmit > /tmp/tsc.log 2>&1
          TSC_EC=$?
          echo "tsc exit code: ${TSC_EC}"
          cat /tmp/tsc.log
          OTHER=$(grep -E "error TS" /tmp/tsc.log | grep -v -E "src/providers/lnSwaps.tsx")
          if [ -n "$OTHER" ]; then
            echo "== TypeScript errors (baseline lnSwaps ignored) =="
            printf '%s\n' "$OTHER"
            exit 1
          fi
          echo "tsc OK (baseline lnSwaps error ignored)"
          exit 0

      - name: Build web app
        env:
          VITE_ARK_SERVER: https://arkade.computer
        run: pnpm build

      - name: Initialize Capacitor
        run: npx cap add android

      - name: Apply CanoArk branding (icons + splash)
        run: node scripts/prepare-branding.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android manifest (camera + minSdk)
        run: node scripts/prepare-android.mjs

      - name: Prepare service worker routing in MainActivity
        run: node scripts/prepare-service-worker.mjs

      - name: Verify camera permissions and minSdk
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'minSdkVersion = 26' android/variables.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: canoark-wallet-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
