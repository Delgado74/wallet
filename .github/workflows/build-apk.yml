name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build from'
        required: true
        default: 'feat/capacular-android-clean'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_ARK_SERVER: https://arkade.computer
      VITE_LNURL_SERVER: https://arkade.computer
      VITE_LNURL_DOMAIN: arkade.computer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Initialize Capacitor
        run: |
          if [ -d "android" ] && [ -f "android/gradlew" ] && [ -f "android/capacitor.settings.gradle" ]; then
            echo "android/ with complete config exists, skipping cap add android"
          elif [ -d "android" ]; then
            echo "android/ exists without complete config, removing"
            rm -rf android
            pnpm exec cap add android
          else
            pnpm exec cap add android
          fi

      - name: Ensure Capacitor Cordova variables
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvCompileSdkVersion = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvTargetSdkVersion = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvBuildToolsVersion = project.hasProperty('buildToolsVersion') ? rootProject.ext.buildToolsVersion : '35.0.0'" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvVersionCodeFromABI = false" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvReleaseSigningPropertiesFile = null" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvDebugSigningPropertiesFile = null" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvAndroidXAppCompatVersion = '1.7.0'" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "    cdvAndroidXCoreVersion = '1.13.1'" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
            echo "Created cordova.variables.gradle"
          else
            echo "cordova.variables.gradle exists"
          fi

      - name: Copy fresh dist directly to Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Copied $(find android/app/src/main/assets/public -type f | wc -l) files"
          du -sh android/app/src/main/assets/public | tail -1

      - name: Prepare ServiceWorker for Capacitor
        run: node scripts/prepare-service-worker.mjs

      - name: Prepare Android manifest (camera + ML Kit)
        run: node scripts/prepare-android.mjs

      - name: Verify camera permissions in manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          elif [ -f android/app/gradlew ]; then
            chmod +x android/app/gradlew
          else
            find android -name gradlew -type f -exec chmod +x {} \;
          fi

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find_app.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: arkade-wallet-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
