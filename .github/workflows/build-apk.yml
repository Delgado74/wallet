name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/capacitor-apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        env:
          VITE_ARK_SERVER: https://arkade.computer
        run: pnpm build

      - name: Initialize Capacitor
        run: npx cap add android

      - name: Apply CanoArk branding (icons + splash)
        run: node scripts/prepare-branding.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android manifest (camera + ML Kit)
        run: node scripts/prepare-android.mjs

      - name: Prepare service worker routing in MainActivity
        run: node scripts/prepare-service-worker.mjs

      - name: Verify camera permissions in manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: arkade-wallet-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
