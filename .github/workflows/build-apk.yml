name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build from'
        required: true
        default: 'feat/capacitor-android-clean'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        env:
          VITE_ARK_SERVER: https://arkade.computer
          VITE_LNURL_SERVER: https://arkade.computer
          VITE_LNURL_DOMAIN: arkade.computer
        run: pnpm build

      - name: Initialize Capacitor
        run: |
          if [ -d "android" ]; then
            echo "android/ exists, skipping npx cap add android"
          else
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android manifest (camera + ML Kit)
        run: node scripts/prepare-android.mjs

      - name: Verify camera permissions in manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: arkade-wallet-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
